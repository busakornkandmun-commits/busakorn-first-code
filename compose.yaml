services:
  mongo:
    image: mongo:6.0.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_URL: mongodb://mongo:27017/blog
    ports:
      - "3001:3001"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: https://solid-telegram-gx79xqqj9r64hvr67-3001.app.github.dev/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    external: true
    name: 4769294fb082f06d424237615349f0030cf24fe4f4a635a6b97bd116dcf6ac49
  mongo_config:
    external: true
    name: 43b4d4116b2dd744b0b8844478bbfe7b2db7ab3636b855b47fb2367db058cf3b
